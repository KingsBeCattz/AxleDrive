[firmware]
build_flags =
  -D FIRMWARE_VERSION=\"1.1.0\"
  -D FIRMWARE_NAME=\"AxleDrive\" 
  -D FIRMWARE_AUTHOR='"Johan E."'

; Put here the id for the h-bridge you want to use. Must be written like: -D HBRIDGE=HBRIDGE_[NAME]
[hbridge-id]
build_flags =
  -D HBRIDGE_L298N=1
  -D HBRIDGE_TB6612=2
  -D HBRIDGE_BTS7960=3

; This is the flag for dual motor control. If you want to use dual motors, set this on the build flags
[dual]
build_flags =
  -D DUAL=1

; Here write any hbridge options like: -D HBRIDGE=HBRIDGE_[NAME]
; Should be the same as the hbridge-id you set above.
[l298n]
build_flags =
  -D HBRIDGE=HBRIDGE_L298N

[tb6612]
build_flags =
  -D HBRIDGE=HBRIDGE_TB6612

[bts7960]
build_flags =
  -D HBRIDGE=HBRIDGE_BTS7960