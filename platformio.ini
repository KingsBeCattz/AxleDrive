[base]
framework = arduino
monitor_speed = 115200
lib_deps =
  https://github.com/KingsBeCattz/MotorDriver.git#main
build_flags =
  -D FIRMWARE_VERSION=\"1.0.0\"
  -D FIRMWARE_NAME=\"AxleDrive\" 
  -D FIRMWARE_AUTHOR='"Johan E."'
  -D HBRIDGE_L298N=1
  -D HBRIDGE_TB6612=2
  -D HBRIDGE_BTS7960=3

[dual]
build_flags =
  -D DUAL=1

[l298n]
build_flags =
  -D HBRIDGE=HBRIDGE_L298N

[tb6612]
build_flags =
  -D HBRIDGE=HBRIDGE_TB6612

[bts7960]
build_flags =
  -D HBRIDGE=HBRIDGE_BTS7960

[esp32]
extends = base
platform = espressif32@6.9.0
platform_packages =
  framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip
build_flags = 
  ${base.build_flags}
  -I bsp/esp32

[env:esp32_l298n]
extends = esp32
board = esp32doit-devkit-v1
build_flags = 
  ${esp32.build_flags}
  ${l298n.build_flags}

[env:esp32_l298n-dual]
extends = esp32
board = esp32doit-devkit-v1
build_flags = 
  ${esp32.build_flags}
  ${l298n.build_flags}
  ${dual.build_flags}

[env:esp32_tb6612]
extends = esp32
board = esp32doit-devkit-v1
build_flags = 
  ${esp32.build_flags}
  ${tb6612.build_flags}

[env:esp32_tb6612-dual]
extends = esp32
board = esp32doit-devkit-v1
build_flags = 
  ${esp32.build_flags}
  ${tb6612.build_flags}
  ${dual.build_flags}

[env:esp32_bts7960]
extends = esp32
board = esp32doit-devkit-v1
build_flags = 
  ${esp32.build_flags}
  ${bts7960.build_flags}

[env:esp32_bts7960-dual]
extends = esp32
board = esp32doit-devkit-v1
build_flags = 
  ${esp32.build_flags}
  ${bts7960.build_flags}
  ${dual.build_flags}