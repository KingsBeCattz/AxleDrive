[platformio]
extra_configs = 
  config.ini
  bases.ini

[env:esp32_l298n]
extends = esp32
board = esp32doit-devkit-v1
build_flags = 
  ${esp32.build_flags}
  ${l298n.build_flags}

[env:esp32_l298n-dual]
extends = esp32
board = esp32doit-devkit-v1
build_flags = 
  ${esp32.build_flags}
  ${l298n.build_flags}
  ${dual.build_flags}

[env:esp32_tb6612]
extends = esp32
board = esp32doit-devkit-v1
build_flags = 
  ${esp32.build_flags}
  ${tb6612.build_flags}

[env:esp32_tb6612-dual]
extends = esp32
board = esp32doit-devkit-v1
build_flags = 
  ${esp32.build_flags}
  ${tb6612.build_flags}
  ${dual.build_flags}

[env:esp32_bts7960]
extends = esp32
board = esp32doit-devkit-v1
build_flags = 
  ${esp32.build_flags}
  ${bts7960.build_flags}

[env:esp32_bts7960-dual]
extends = esp32
board = esp32doit-devkit-v1
build_flags = 
  ${esp32.build_flags}
  ${bts7960.build_flags}
  ${dual.build_flags}

[env:maker-esp32-pro]
extends = esp32
board = esp32doit-devkit-v1
build_flags = 
  ${base.build_flags}
  ${dual.build_flags}
  -I bsp/maker-esp32-pro
  -I bsp/esp32-shared
build_src_filter =
  +<*>
  +<../bsp/esp32-shared/*.cpp>