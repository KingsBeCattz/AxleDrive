[base]
framework = arduino
monitor_speed = 115200
lib_deps =
  https://github.com/KingsBeCattz/MotorDriver.git#main
build_flags =
  ${firmware.build_flags}
  ${hbridge-id.build_flags}

; ESP32 Based boards
[esp32]
extends = base
platform = espressif32@6.9.0
platform_packages =
  framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip
build_flags = 
  ${base.build_flags}
  -I bsp/esp32
  -I bsp/esp32-shared

; AVR Based boards
[avr]
extends = base
platform = atmelavr
build_flags = 
  ${base.build_flags}
  -I bsp/avr